# Builds and publishes the signed Android client as its own GitHub release.
#
# Independent of the upstream Codex release pipeline: it is driven by
# `android-v*` tags and publishes only the APK.
#
# Required secrets:
#   ANDROID_KEYSTORE_BASE64 - base64 of the release keystore (.jks)
#   KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
name: codex-android-release

on:
  push:
    tags:
      - "android-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing android-v* tag to build and publish.
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    name: Build and publish signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: Resolve version from tag
        id: version
        env:
          RAW_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$RAW_TAG" | grep -Eq '^android-v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag must look like android-vMAJOR.MINOR.PATCH (got: $RAW_TAG)"
            exit 1
          fi
          version="${RAW_TAG#android-v}"
          IFS=. read -r major minor patch <<< "$version"
          # versionCode must increase monotonically across releases.
          version_code=$(( major * 10000 + minor * 100 + patch ))
          {
            echo "tag=$RAW_TAG"
            echo "version=$version"
            echo "version_code=$version_code"
          } >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set."
            exit 1
          fi
          printenv ANDROID_KEYSTORE_BASE64 | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          set -euo pipefail
          ./gradlew assembleRelease \
            -PversionName="$VERSION_NAME" \
            -PversionCode="$VERSION_CODE" \
            --stacktrace

      - name: Stage APK
        id: apk
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          src="$(find android/app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          if [ -z "$src" ]; then
            echo "::error::No release APK was produced."
            exit 1
          fi
          case "$src" in
            *unsigned*)
              echo "::error::Release APK is unsigned; check the keystore secrets."
              exit 1
              ;;
          esac
          dest="$RUNNER_TEMP/codex-mobile-$VERSION.apk"
          cp "$src" "$dest"
          echo "path=$dest" >> "$GITHUB_OUTPUT"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          APK: ${{ steps.apk.outputs.path }}
        run: |
          set -euo pipefail
          gh release create "$TAG" "$APK" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Codex Mobile $VERSION" \
            --notes "Codex Mobile: a Codex Cloud client for Android. Sign in with your ChatGPT account. Requires Android 8.0 (API 26) or newer."

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
